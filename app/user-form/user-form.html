<form (ngSubmit)="onSubmit()" #userForm="ngForm" class="needs-validation" novalidate>
  <div class="row g-3">
    <!-- Username Field -->
    <div class="col-12">
      <label for="username" class="form-label fw-semibold">
        <i class="fas fa-user me-2 text-primary"></i>
        Username
      </label>
      <div class="input-group">
        <span class="input-group-text bg-light border-end-0">
          <i class="fas fa-user text-muted"></i>
        </span>
        <input 
          type="text" 
          class="form-control border-start-0" 
          id="username"
          name="username" 
          [(ngModel)]="newValues.username" 
          required
          placeholder="Enter username"
          [ngClass]="{ 'is-invalid': userForm.submitted && userForm.form.get('username')?.errors }"
        />
      </div>
      <div *ngIf="userForm.submitted && userForm.form.get('username')?.errors" class="invalid-feedback d-block">
        <div *ngIf="userForm.form.get('username')?.errors?.['required']">Username is required</div>
      </div>
    </div>

    <!-- Email Field -->
    <div class="col-12">
      <label for="email" class="form-label fw-semibold">
        <i class="fas fa-envelope me-2 text-primary"></i>
        Email Address
      </label>
      <div class="input-group">
        <span class="input-group-text bg-light border-end-0">
          <i class="fas fa-envelope text-muted"></i>
        </span>
        <input 
          type="email" 
          class="form-control border-start-0" 
          id="email"
          name="email" 
          [(ngModel)]="newValues.email" 
          required
          placeholder="Enter email address"
          [ngClass]="{ 'is-invalid': userForm.submitted && userForm.form.get('email')?.errors }"
        />
      </div>
      <div *ngIf="userForm.submitted && userForm.form.get('email')?.errors" class="invalid-feedback d-block">
        <div *ngIf="userForm.form.get('email')?.errors?.['required']">Email is required</div>
        <div *ngIf="userForm.form.get('email')?.errors?.['email']">Please enter a valid email address</div>
      </div>
    </div>

    <!-- Password Field (for new users) -->
    <div class="col-12" *ngIf="!user">
      <label for="password" class="form-label fw-semibold">
        <i class="fas fa-lock me-2 text-primary"></i>
        Password
      </label>
      <div class="input-group">
        <span class="input-group-text bg-light border-end-0">
          <i class="fas fa-lock text-muted"></i>
        </span>
        <input 
          type="password" 
          class="form-control border-start-0" 
          id="password"
          name="password" 
          [(ngModel)]="newValues.password" 
          required
          placeholder="Enter password"
          [ngClass]="{ 'is-invalid': userForm.submitted && userForm.form.get('password')?.errors }"
        />
      </div>
      <div *ngIf="userForm.submitted && userForm.form.get('password')?.errors" class="invalid-feedback d-block">
        <div *ngIf="userForm.form.get('password')?.errors?.['required']">Password is required</div>
      </div>
    </div>

    <!-- Admin Role Toggle -->
    <div class="col-12">
      <div class="form-check form-switch">
        <input 
          class="form-check-input" 
          type="checkbox" 
          id="isAdmin"
          name="isAdmin" 
          [(ngModel)]="newValues.isAdmin"
        />
        <label class="form-check-label fw-semibold" for="isAdmin">
          <i class="fas fa-shield-alt me-2 text-warning"></i>
          Administrator Role
        </label>
        <div class="form-text">
          <i class="fas fa-info-circle me-1"></i>
          Administrators have full access to manage users and system settings.
        </div>
      </div>
    </div>

    <!-- Submit Button -->
    <div class="col-12">
      <div class="d-grid gap-2">
        <button 
          type="submit" 
          class="btn btn-primary btn-lg fw-semibold" 
          [disabled]="userForm.invalid"
        >
          <i class="fas fa-save me-2"></i>
          {{ user ? 'Update User' : 'Create User' }}
        </button>
      </div>
    </div>
  </div>
</form>
