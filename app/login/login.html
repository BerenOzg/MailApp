<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="row justify-content-center w-100">
    <div class="col-12 col-sm-8 col-md-6 col-lg-4">
      <div class="card shadow-lg border-0">
        <div class="card-body p-5">
          <div class="text-center mb-4">
            <div class="bg-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px;">
              <i class="fas fa-envelope text-white" style="font-size: 2rem;"></i>
            </div>
            <h2 class="card-title text-dark mb-2">Welcome Back</h2>
            <p class="text-muted">Sign in to your MailApp account</p>
          </div>

          <form
            *ngIf="!isLoggedIn"
            name="form"
            (ngSubmit)="f.form.valid && onSubmit()"
            #f="ngForm"
            novalidate
          >
            <div class="mb-3">
              <label for="username" class="form-label fw-semibold">Username</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0">
                  <i class="fas fa-user text-muted"></i>
                </span>
                <input
                  type="text"
                  class="form-control border-start-0"
                  id="username"
                  name="username"
                  [(ngModel)]="form.username"
                  required
                  #username="ngModel"
                  [ngClass]="{ 'is-invalid': f.submitted && username.errors }"
                  placeholder="Enter your username"
                />
              </div>
              <div *ngIf="username.errors && f.submitted" class="invalid-feedback d-block">
                Username is required!
              </div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0">
                  <i class="fas fa-lock text-muted"></i>
                </span>
                <input
                  type="password"
                  class="form-control border-start-0"
                  id="password"
                  name="password"
                  [(ngModel)]="form.password"
                  required
                  #password="ngModel"
                  [ngClass]="{ 'is-invalid': f.submitted && password.errors }"
                  placeholder="Enter your password"
                />
              </div>
              <div *ngIf="password.errors && f.submitted" class="invalid-feedback d-block">
                <div *ngIf="password.errors['required']">Password is required</div>
              </div>
            </div>

            <div class="d-grid mb-3">
              <button class="btn btn-primary btn-lg fw-semibold" type="submit">
                <i class="fas fa-sign-in-alt me-2"></i>
                Sign In
              </button>
            </div>

            <div *ngIf="f.submitted && isLoginFailed" class="alert alert-danger d-flex align-items-center" role="alert">
              <i class="fas fa-exclamation-triangle me-2"></i>
              <div>Login failed: {{ errorMessage }}</div>
            </div>
          </form>

          <div *ngIf="isLoggedIn" class="alert alert-success d-flex align-items-center" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <div>Successfully logged in as <strong>{{ form.username }}</strong></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
