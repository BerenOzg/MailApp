<div class="row g-4">
  <!-- Messages List -->
  <div class="col-lg-5">
    <div class="card border-0 shadow-sm h-100">
      <div class="card-header bg-white border-bottom">
        <h5 class="mb-0 text-dark fw-semibold">
          <i class="fas fa-list me-2 text-primary"></i>
          Messages ({{ messages?.length || 0 }})
        </h5>
      </div>
      <div class="card-body p-0">
        <div class="list-group list-group-flush">
          <div
            class="list-group-item list-group-item-action border-0 py-3 px-4 cursor-pointer"
            *ngFor="let message of messages; let i = index; trackBy: trackByFn"
            [class.active]="i === currentIndex"
            (click)="setActiveMessage(message, i)"
            style="cursor: pointer;"
          >
            <div class="d-flex justify-content-between align-items-start mb-2">
              <h6 class="mb-1 fw-semibold text-truncate" style="max-width: 200px;">
                {{ message.title }}
              </h6>
              <small class="text-muted">
                {{ message.sentAt | date:'short' }}
              </small>
            </div>
            <div class="d-flex justify-content-between align-items-center">
              <small class="text-muted text-truncate" style="max-width: 150px;">
                <i class="fas fa-user me-1"></i>
                {{ getFromUsername(message) }}
              </small>
              <span class="badge bg-primary rounded-pill" *ngIf="message.unread">
                New
              </span>
            </div>
          </div>
        </div>
        
        <div *ngIf="!messages || messages.length === 0" class="text-center py-5">
          <div class="text-muted">
            <i class="fas fa-inbox fa-3x mb-3"></i>
            <p class="mb-0">No messages found.</p>
            <small>Your inbox is empty.</small>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Message Details -->
  <div class="col-lg-7">
    <div class="card border-0 shadow-sm h-100">
      <div class="card-header bg-white border-bottom">
        <h5 class="mb-0 text-dark fw-semibold">
          <i class="fas fa-envelope me-2 text-primary"></i>
          Message Details
        </h5>
      </div>
      <div class="card-body">
        <app-mail-details [currentMessage]="currentMessage" />
      </div>
    </div>
  </div>
</div>
