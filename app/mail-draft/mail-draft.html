<div>
    <div class="submit-form">
        <div *ngIf="!submitted">
            <div class="form-group">
                <label for="title">Title</label>
                <input
                    type="text"
                    class="form-control"
                    id="title"
                    required
                    [(ngModel)]="message.title"
                    name="title"
                    placeholder="Enter a title"
                />
            </div>
            
            <div class="form-group">
            <label for="to">Recipients</label>
                <input
                    type="text"
                    class="form-control"
                    id="to"
                    [(ngModel)]="recipientsInput"
                    name="to"
                    placeholder="Enter comma-separated usernames"
                />
            </div>

            <div class="form-group">
                <label for="content">Content</label>
                <textarea
                    #contentArea
                    class="form-control"
                    id="content"
                    [(ngModel)]="message.content"
                    name="content"
                    placeholder="Enter your message..."
                    (input)="adjustHeight()"
                    style="height:100px; overflow:hidden; resize:none;"
                    ></textarea>
            </div>

            <button (click)="saveMessage()" class="btn btn-success">Submit</button>
        </div>

        <div *ngIf="submitted">
            <h4>Message was sent successfully!</h4>
            <button class="btn btn-success" (click)="newMessage()">Add</button>
        </div>
    </div>
</div>
