<div *ngIf="currentUser; else noUser" class="h-100">
  <div class="card border-0 shadow-sm h-100">
    <div class="card-header bg-white border-bottom">
      <div class="d-flex justify-content-between align-items-start">
        <h4 class="mb-0 text-dark fw-bold">{{ currentUser.username }}</h4>
        <button 
          class="btn btn-outline-primary btn-sm"
          (click)="showEditForm = true"
        >
          <i class="fas fa-edit me-1"></i>
          Edit User
        </button>
      </div>
    </div>
    
    <div class="card-body">
      <!-- User Information -->
      <div class="row mb-4">
        <div class="col-12">
          <div class="bg-light rounded p-3">
            <div class="row g-3">
              <div class="col-md-6">
                <div class="d-flex align-items-center">
                  <i class="fas fa-user text-primary me-2"></i>
                  <div>
                    <small class="text-muted d-block">Username</small>
                    <span class="fw-medium">{{ currentUser.username }}</span>
                  </div>
                </div>
              </div>
              <div class="col-md-6">
                <div class="d-flex align-items-center">
                  <i class="fas fa-envelope text-primary me-2"></i>
                  <div>
                    <small class="text-muted d-block">Email Address</small>
                    <span class="fw-medium">{{ currentUser.email }}</span>
                  </div>
                </div>
              </div>
              <div class="col-12">
                <div class="d-flex align-items-center">
                  <i class="fas fa-shield-alt text-warning me-2" *ngIf="currentUser.isAdmin"></i>
                  <i class="fas fa-user text-primary me-2" *ngIf="!currentUser.isAdmin"></i>
                  <div>
                    <small class="text-muted d-block">Account Role</small>
                    <span class="badge" [class]="currentUser.isAdmin ? 'bg-danger' : 'bg-primary'">
                      {{ currentUser.isAdmin ? 'Administrator' : 'Standard User' }}
                    </span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- User Actions -->
      <div class="d-flex gap-2">
        <button 
          class="btn btn-outline-primary"
          (click)="showEditForm = true"
        >
          <i class="fas fa-edit me-1"></i>
          Edit User
        </button>
        <button 
          *ngIf="canDeleteUser(currentUser)"
          class="btn btn-outline-danger"
          (click)="deleteUser(currentUser)"
        >
          <i class="fas fa-trash me-1"></i>
          Delete User
        </button>
      </div>
    </div>
  </div>
</div>

<ng-template #noUser>
  <div class="h-100 d-flex align-items-center justify-content-center">
    <div class="text-center text-muted">
      <i class="fas fa-user fa-4x mb-3"></i>
      <h5 class="mb-2">No User Selected</h5>
      <p class="mb-0">Select a user from the list to view their details.</p>
    </div>
  </div>
</ng-template>

<!-- Edit User Modal -->
<div *ngIf="showEditForm" class="modal fade show d-block" style="background-color: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">
          <i class="fas fa-edit me-2 text-primary"></i>
          Edit User: {{ currentUser?.username }}
        </h5>
        <button 
          type="button" 
          class="btn-close" 
          (click)="showEditForm = false"
        ></button>
      </div>
      <div class="modal-body">
        <app-user-form [user]="currentUser" (ngSubmit)="onEditComplete()"></app-user-form>
      </div>
      <div class="modal-footer">
        <button 
          type="button" 
          class="btn btn-secondary" 
          (click)="showEditForm = false"
        >
          <i class="fas fa-times me-1"></i>
          Cancel
        </button>
      </div>
    </div>
  </div>
</div>
